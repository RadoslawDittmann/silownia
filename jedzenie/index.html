  if (ds.month) { const [y, mo] = S.month.split('-').map(Number), d = new Date(y, mo - 1 + Number(ds.month), 1); S.month = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; render(true); return; }
  if (ds.gowk) { S.week = ds.gowk; location.hash = 'tydzien'; return; }
  if (ds.chk) { change(d => { const e = findE(d, ds.chk); if (e) { e.ok = !e.ok; e.p = false; } }); return; }
  if (ds.open) { S.open[ds.open] = !S.open[ds.open]; render(true); return; }
  if (ds.qty) { change(d => { const e = findE(d, ds.qty); if (e) { e.q = stepQ(e.q || 1, Number(ds.dir), e); e.p = false; } }); return; }
  if (ds.setq) { change(d => { const e = findE(d, ds.setq); if (e) { e.q = Number(ds.q); e.p = false; } }); return; }
  if (ds.pkq) { pkSetQ(Number(ds.pkq)); return; }
  if (ds.jump) { const hd = $('#pkc-' + ds.jump); if (hd) $('#pk-list').scrollTop = hd.offsetTop - 2; return; }
  if (ds.var) {
    change(d => {
      const e = findE(d, ds.var), f = e && FM[e.f];
      if (f) { delete e.ing; delete e.por; delete e.rest; Object.assign(e, snap(f, ds.v), { p: false }); }
    });
    return;
  }
  if (ds.rm) {
    const date = S.date;
    change(d => {
      const i = d.items.findIndex(e => e.id === ds.rm);
      if (i < 0) return;
      const [e] = d.items.splice(i, 1);
      S.toast = { view: 'dzien', text: `Usunięto „${e.n}”.`, undo: () => { const dd = mat(date); dd.items.splice(Math.min(i, dd.items.length), 0, e); persist(); render(true); } };
    });
    return;
  }
  if (ds.add) { openPicker(ds.add); return; }
  if (ds.pick) {
    const f = FM[ds.pick];
    if (f) addEntry(snap(f, ds.v));
    return;
  }
  if (ds.fedit) { openFood(ds.fedit); return; }
  if (ds.cmadd) { cmAdd(ds.cmadd); return; }
  if (ds.cmstep) { const r = CM.rows[+ds.cmstep]; if (r) cmSetQ(+ds.cmstep, stepQ(r.q || 1, Number(ds.dir), r)); return; }
  if (ds.cmrm) { CM.rows.splice(+ds.cmrm, 1); cmRender(); return; }
  if (ds.cment) {
    const e = findE(dayOf(S.date), ds.cment);
    if (!e) return;
    const f = e.f ? FM[e.f] : null, vf = verOf(f, e.v);
    openCmp({ mode: 'entry', date: S.date, id: e.id, f: !!f, v: e.v, rows: e.ing || (vf && vf.ing) || [], por: e.ing ? e.por : f && f.por,
      rest: e.ing ? e.rest : vf && vf.rest, self: e.f, title: 'Składniki · ' + e.n + (e.v === 'L' ? ' · LIGHT' : e.v ? ' · PEŁNA' : '') });
    return;
  }
  if (ds.sedit) { openSlot(ds.sedit); return; }
  if (ds.srestore) { setSlotHidden(ds.srestore, false); render(true); return; }
  if (ds.frestore) { restoreFood(ds.frestore); return; }
  if (ds.fpurge) {
    if (!ds.armed) { ds.armed = '1'; t.textContent = 'Na pewno?'; t.classList.add('armed'); return; }
    purgeFood([ds.fpurge]); return;
  }
  switch (ds.act) {
    case 'today': goDate(todayISO()); return;
    case 'thisweek': S.week = null; render(true); return;
    case 'thismonth': S.month = null; render(true); return;
    case 'allok': change(d => d.items.forEach(e => { e.ok = true; e.p = false; })); return;
    case 'rmpending': {
      const date = S.date;
      change(d => {
        const removed = d.items.map((e, i) => [i, e]).filter(([, e]) => !e.ok);
        d.items = d.items.filter(e => e.ok);
        removed.forEach(([, e]) => delete S.open[e.id]);
        S.toast = { view: 'dzien', text: `Usunięto niezaznaczone (${removed.length}).`, undo: () => {
          const dd = mat(date);
          for (const [i, e] of removed) dd.items.splice(Math.min(i, dd.items.length), 0, e);
          persist(); render(true);
        } };
      });
      return;
    }
    case 'undo': { const u = S.toast && S.toast.undo; S.toast = null; if (u) u(); return; }
    case 'pk-close': closeDlg($('#pick')); return;
    case 'pk-undo': {
      const { last } = pkLast();
      if (last) { const d = S.days[S.date]; d.items = d.items.filter(e => e !== last); PK.added = PK.added.filter(id => id !== last.id); persist(); render(true); pkBar(); }
      return;
    }
    case 'fnew': openFood(null); return;
    case 'cm-newp': openCmp({ mode: 'new', title: 'Nowy posiłek ze składników' }); return;
    case 'cm-pick': openCmp({ mode: 'new', pick: true, title: 'Złóż ze składników · ' + slotInfo(PK.slot).n }); return;
    case 'cm-close': closeDlg($('#cmp')); return;
    case 'cm-ok': cmOk(); return;
    case 'fed-noing': FE.ing = null; fedIngSync(); FF('k').focus(); return;
    case 'fed-noLing': FE.Ling = null; fedIngSync(); FF('Lk').focus(); return;
    case 'fed-ing': case 'fed-Ling': {
      const b = FE.id && BASEM[FE.id], nm = FF('n').value.trim() || 'nowy produkt';
      if (ds.act === 'fed-ing') openCmp({ mode: 'food', which: 'P', rows: FE.ing || (b && b.ing) || [], por: FE.por, rest: FE.rest, self: FE.id, title: 'Składniki · ' + nm });
      else openCmp({ mode: 'food', which: 'L', rows: FE.Ling || (b && b.L && b.L.ing) || FE.ing || [], por: FE.por, rest: FE.Lrest, self: FE.id, title: 'Składniki LIGHT · ' + nm });
      return;
    }
    case 'fed-cancel': closeDlg($('#fed')); return;
    case 'fed-base': fillFood({ ...BASEM[FE.id] }); $('#fed-err').textContent = 'Wpisane wartości z planu — zatwierdź „Zapisz”.'; return;
    case 'fpurge-all':
      if (!ds.armed) { ds.armed = '1'; t.textContent = 'Na pewno usunąć trwale wszystkie?'; t.classList.add('armed'); return; }
      purgeFood(rmFoods(S.view).map(f => f.id)); return;
    case 'fed-del':
      if (!ds.armed) { ds.armed = '1'; t.textContent = 'Na pewno usunąć?'; t.classList.add('armed'); return; }
      removeFood(FE.id); return;
    case 'tgreset': S.settings.targets = {}; delete S.settings.bfz; delete S.settings.rate; persist(); render(true); return;
    case 'snew': openSlot(null); return;
    case 'sed-cancel': closeDlg($('#sed')); return;
    case 'sed-base': FS('n').value = SLOTS[SE.id].n; FS('t').value = SLOTS[SE.id].t; return;
    case 'sed-del':
      if (!ds.armed) { ds.armed = '1'; t.textContent = 'Na pewno usunąć?'; t.classList.add('armed'); return; }
      removeSlot(SE.id); return;
    case 'export': exportData(); return;
    case 'import': $('#import-file').click(); return;
  }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 'dtype') { setType(S.date, t.value); persist(); render(true); return; }
  // wydatek z zegarka (puste = przewidywany)
  if (t.dataset && t.dataset.burn) {
    const raw = t.value.trim(), v = parseInt(raw, 10), d = mat(t.dataset.burn);
    if (raw === '') delete d.burn;
    else if (v >= 500 && v <= 9000) d.burn = v;
    else { render(true); return; }
    persist(); render(true); return;
  }
  if (t.dataset && (t.dataset.tg || t.dataset.base || t.dataset.bfz || t.dataset.rate)) { render(true); return; }
  // korekta z wagi: wpis ręczny (od dziś) i włączenie / wyłączenie automatycznej
  if (t.dataset && t.dataset.adj) {
    const v = parseInt(t.value.replace(/[−–]/, '-').replace('+', '').trim() || '0', 10);
    if (v >= -1000 && v <= 1000) { setAdj(Math.round(v / 10) * 10); persist(); }
    render(true); return;
  }
  if (t.dataset && t.dataset.adjon) { if (t.checked) { delete S.settings.adjOff; runAdj(); } else S.settings.adjOff = true; persist(); render(true); return; }
  // waga rano (puste = usuń pomiar)
  if (t.dataset && t.dataset.kg) {
    const raw = t.value.trim().replace(',', '.'), v = parseFloat(raw), date = t.dataset.kg;
    if (raw === '') { if (S.days[date]) delete S.days[date].kg; }
    else if (v >= 30 && v <= 250) mat(date).kg = Math.round(v * 10) / 10;
    else { render(true); return; }
    KG = null; runAdj(); persist(); render(true); return;
  }
  // % tkanki tłuszczowej (puste = usuń pomiar)
  if (t.dataset && t.dataset.bf) {
    const raw = t.value.trim().replace(',', '.').replace('%', ''), v = parseFloat(raw), date = t.dataset.bf;
    if (raw === '') { if (S.days[date]) delete S.days[date].bf; }
    else if (v >= 3 && v <= 60) mat(date).bf = Math.round(v * 10) / 10;
    else { render(true); return; }
    persist(); render(true); return;
  }
  if (t.dataset && 'wk' in t.dataset && TYPES[t.value]) { S.settings.wk = DEF_TYPE.map((x, i) => i === +t.dataset.wk ? t.value : wkType(i)); persist(); render(true); return; }
  if (t.name === 'hasL') { lboxSync(); return; }
  // gramy: przelicz na liczbę jednostek
  if (t.dataset && t.dataset.grams) {
    const v = num(t.value);
    change(d => { const e = findE(d, t.dataset.grams); if (e && e.g && v > 0) { e.q = Math.min(50, Math.round(v / e.g * 1000) / 1000); e.p = false; } });
    return;
  }
  if (t.id === 'pk-grams') { const { last } = pkLast(); const v = num(t.value); if (last && last.g && v > 0) pkSetQ(v / last.g); return; }
  if (t.dataset && t.dataset.pcs) {
    const v = num(t.value);
    change(d => { const e = findE(d, t.dataset.pcs); if (e && v > 0) { e.q = Math.min(50, Math.round(qFromPcs(e, v) * 1000) / 1000); e.p = false; } });
    return;
  }
  if (t.id === 'pk-pcs') { const { last } = pkLast(); const v = num(t.value); if (last && v > 0) pkSetQ(qFromPcs(last, v)); return; }
  // składniki: gramy / sztuki / liczba porcji
  if (t.dataset && t.dataset.cmg) { const r = CM.rows[+t.dataset.cmg], v = num(t.value); if (r && r.g && v > 0) cmSetQ(+t.dataset.cmg, v / r.g); else cmRender(); return; }
  if (t.dataset && t.dataset.cmp) { const r = CM.rows[+t.dataset.cmp], v = num(t.value); if (r && v > 0) cmSetQ(+t.dataset.cmp, qFromPcs(r, v)); else cmRender(); return; }
  if (t.id === 'cm-por') { const v = num(t.value); if (v > 0 && v <= 50) CM.por = Math.round(v * 10) / 10; t.value = d1(CM.por); cmRender(); return; }
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.id === 'pk-q') { pickList(); $('#pk-list').scrollTop = 0; return; }
  if (t.id === 'cm-q') { cmHits(); $('#cm-list').scrollTop = 0; return; }
  if (t.id === 'pq') { S.pq[t.dataset.kind] = t.value; $('#plist').innerHTML = plistHTML(t.dataset.kind); return; }
  if (t.dataset && t.dataset.tg) {
    const f = t.dataset.f, v = parseInt(t.value.replace(/[−–]/, '-').replace('+', '').trim(), 10);
    if (!(f === 'plus' ? v >= -2000 && v <= 1500 : f === 'act' ? v >= 800 && v <= 9000 : v > 0 && v < 1000)) return;
    const k = t.dataset.tg;
    // wydatek wpisany przy obecnej masie → zapamiętana sama aktywność
    // białko wpisane przy obecnej masie beztłuszczowej → zapamiętane przy masie z ustawień
    S.settings.targets[k] = { ...(S.settings.targets[k] || {}), [f]: f === 'act' ? v - baseAt() : f === 'b' ? Math.round(v * refBody().lbm / bodyAt().lbm * 10) / 10 : v };
    persist();
  }
  if (t.dataset && t.dataset.bfz) {
    const z = { ...bfSet(), [t.dataset.bfz]: Math.round(parseFloat(t.value.replace(',', '.')) * 10) / 10 };
    if (!(z.lo >= 3 && z.lo < z.mid && z.mid < z.hi && z.hi <= 40)) return;
    S.settings.bfz = z; persist();
  }
  if (t.dataset && t.dataset.rate) {
    const v = parseFloat(t.value.replace(',', '.'));
    if (v >= 0 && v <= 2) { S.settings.rate = Math.round(v * 20) / 20; persist(); }
  }
  if (t.dataset && t.dataset.base) {
    const f = t.dataset.base, v = parseFloat(t.value.replace(',', '.'));
    if (!(f === 'k' ? v >= 1000 && v <= 4000 : f === 'bf' ? v >= 3 && v <= 60 : v >= 30 && v <= 250)) return;
    S.settings.base = { ...baseSet(), [f]: f === 'k' ? Math.round(v) : Math.round(v * 10) / 10 };
    persist();
  }
});
document.addEventListener('toggle', ev => {
  if (ev.target.id === 'settings') S.setOpen = ev.target.open;
  if (ev.target.dataset && ev.target.dataset.pc) S.popen[ev.target.dataset.pc] = ev.target.open;
}, true);
$('#own-form').addEventListener('submit', ev => { ev.preventDefault(); addOwn(); });
// Enter w polu gramów: zatwierdź bez wysyłania formularza
document.addEventListener('keydown', ev => { if (ev.key === 'Enter' && ev.target.id === 'cm-q') { ev.preventDefault(); const b = $('#cm-hits [data-cmadd]'); if (b) cmAdd(b.dataset.cmadd); return; } });
document.addEventListener('keydown', ev => { if (ev.key === 'Enter' && (ev.target.id === 'pk-grams' || ev.target.id === 'pk-pcs' || ev.target.id === 'cm-por' || (ev.target.dataset && (ev.target.dataset.cmg || ev.target.dataset.cmp || ev.target.dataset.grams || ev.target.dataset.pcs || ev.target.dataset.burn || ev.target.dataset.kg || ev.target.dataset.bf || ev.target.dataset.bfz || ev.target.dataset.rate || ev.target.dataset.adj || ev.target.dataset.base || ev.target.dataset.tg)))) { ev.preventDefault(); ev.target.blur(); } });
fform.addEventListener('submit', ev => { ev.preventDefault(); saveFood(); });
$('#import-file').addEventListener('change', ev => { const f = ev.target.files && ev.target.files[0]; if (f) importData(f); ev.target.value = ''; });
window.addEventListener('hashchange', () => render());
// Po północy (aplikacja otwarta w tle) — przejdź na nowy dzień
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.follow && S.date !== todayISO()) { runAdj(); render(); } });

/* ---------- Start ---------- */
// Jednorazowo — v9: cel liczony z wydatku (stare stałe cele kcal i wydatki znikają), poniedziałek domyślnie siłowy;
// v10: wydatek z ustawień (burn) zamieniony na aktywność ponad „bez aktywności” (act = burn − 2015)
function migrate() {
  const mv = S.settings.mv || 0;
  if (mv >= 12) return;
  const had = Object.keys(S.days).length || Object.keys(S.settings.targets).length || S.foods.removed.length || S.foods.added.length || S.foods.gone.length; // świeża instalacja — nic nie zapisuj
  for (const k of Object.keys(S.settings.targets)) {
    const o = S.settings.targets[k] || {};
    if (mv < 9) delete o.kcal;
    else if (o.burn != null) o.act = o.burn - BASE_DEF.k;
    delete o.burn;
    if (!Object.keys(o).length) delete S.settings.targets[k];
  }
  const today = todayISO();
  if (mv < 9) for (const [date, d] of Object.entries(S.days)) if (date >= today && d.type === 'post' && parseD(date).getDay() === 1 && !d.items.some(e => e.ok)) setType(date, 'sil');
  if (mv < 11) { // posiłek 14:00 nie jest dopisywany do dni — tylko do wyboru w oknie „Dodaj”
    if (S.foods.removed.includes('JG1')) { S.foods.removed = S.foods.removed.filter(id => id !== 'JG1'); buildFoods(); }
    for (const [date, d] of Object.entries(S.days)) if (date >= today) d.items = d.items.filter(e => !(e.f === 'JG1' && e.p && !e.ok));
  }
  if (mv < 12) { // posiłki złożone ze składników (v19) z „Moje” do „Moje posiłki”
    let n = 0;
    for (const f of S.foods.added) if (f.ing && f.c === 'moje') { f.c = 'posilki'; n++; }
    if (n) buildFoods();
  }
  S.settings.mv = 12;
  if (had) persist();
}
migrate();
runAdj();
render();
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
})();
</script>
</body>
