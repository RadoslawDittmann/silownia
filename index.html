<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Siłownia</title>
<meta name="description" content="Dziennik ciężarów według partii ciała — działa offline">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191D21" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Siłownia">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
/* Layout: jedna kolumna kart (max 720px), przypięty pasek partii ciała u góry, pasek przerwy przy dolnej krawędzi.
   Fonty systemowe — bez internetu nic nie musi się dociągać. */
:root {
  --bg: #EDEFEE;
  --surface: #FFFFFF;
  --ink: #15181B;
  --muted: #59616A;
  --line: #D3D8D6;
  --chip: #E3E7E5;
  --accent: #1E4FA6;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCE5F6;
  --up: #16703E;
  --up-soft: #DCF0E3;
  --reps: #855700;
  --reps-soft: #F5EAD2;
  --low: #A3261D;
  --low-soft: #F6DFDC;
  --font-display: "Avenir Next Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --radius: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101315; --surface: #191D21; --ink: #E8EBEE; --muted: #9AA3AC; --line: #2B3137; --chip: #252B31;
    --accent: #7FA6FF; --accent-ink: #0D1420; --accent-soft: #1E2A42;
    --up: #5CC98A; --up-soft: #17301F; --reps: #E2B456; --reps-soft: #33290F; --low: #FF8A80; --low-soft: #3A1C1A;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--surface);
}
.wrap {
  max-width: 720px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; margin: 0; text-wrap: balance; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.top .wrap { padding-block: 10px 0; display: grid; gap: 6px; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand h1 { font-size: 1.7rem; text-transform: uppercase; letter-spacing: 0.02em; }
.today { color: var(--muted); font-size: 0.9rem; font-variant-numeric: tabular-nums; }
.tabs-scroll { overflow-x: auto; scrollbar-width: none; margin-inline: -4px; }
.tabs-scroll::-webkit-scrollbar { display: none; }
.tabs { display: flex; gap: 2px; padding: 0 4px; min-width: max-content; }
.tab {
  border: 0; background: none; padding: 6px 12px 10px; border-bottom: 3px solid transparent;
  min-height: 44px; font-family: var(--font-display); font-size: 1.15rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted);
}
.tab[aria-current="page"] { border-bottom-color: var(--accent); color: var(--accent); }
.tab .n { display: inline-block; min-width: 1.3em; margin-left: 4px; padding: 0 5px; border-radius: 999px; background: var(--up); color: var(--surface); font-size: 0.8rem; line-height: 1.4; text-align: center; vertical-align: 2px; }

main { padding-block: 16px 150px; display: grid; gap: 14px; }
.banner { background: var(--low-soft); color: var(--low); border-radius: 10px; padding: 10px 12px; font-weight: 600; }
.ready { background: var(--up-soft); border-radius: 12px; padding: 10px 12px; display: grid; gap: 8px; }
.ready b { color: var(--up); }
.ready .list { display: flex; flex-wrap: wrap; gap: 6px; }
.ready button { border: 1px solid var(--up); color: var(--up); background: none; border-radius: 999px; padding: 4px 10px; font-size: 0.88rem; font-weight: 600; min-height: 32px; }

.phead { display: grid; gap: 4px; padding-block: 4px; }
.phead h2 { font-size: 2.3rem; text-transform: uppercase; line-height: 1; }
.phead .sub { color: var(--muted); font-size: 0.95rem; font-variant-numeric: tabular-nums; }
.subhead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-top: 6px; }
.subhead h3 { font-size: 1.25rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
.subhead span { color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }

.ex {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px; display: grid; gap: 12px; scroll-margin-top: 130px; min-width: 0;
}
.ex.hl { border-color: var(--accent); }
.ex-title h3 { font-size: 1.35rem; line-height: 1.15; }
.en { color: var(--muted); font-size: 0.86rem; margin: 2px 0 0; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.target { font-family: var(--font-display); font-weight: 700; font-size: 1.25rem; margin-right: 4px; font-variant-numeric: tabular-nums; }
.chip { background: var(--chip); border-radius: 999px; padding: 3px 10px; font-size: 0.8rem; color: var(--muted); }
.rest {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 4px 12px; font-size: 0.85rem; font-weight: 600; min-height: 34px;
}

.load { display: grid; grid-template-columns: 52px 1fr 52px; gap: 8px; align-items: center; }
.step {
  height: 52px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg);
  font-size: 1.7rem; font-weight: 600; line-height: 1;
}
.step:active { background: var(--chip); }
.kg { display: flex; align-items: baseline; justify-content: center; gap: 6px; }
.kg input {
  width: 6ch; text-align: center; border: 0; border-bottom: 2px solid var(--line); background: none;
  font-family: var(--font-display); font-weight: 700; font-size: 2.5rem; line-height: 1.1; padding: 0;
  font-variant-numeric: tabular-nums; border-radius: 0;
}
.kg input:focus { outline: none; border-bottom-color: var(--accent); }
.kg span { font-family: var(--font-display); font-size: 1.2rem; color: var(--muted); }
.load-note { grid-column: 1 / -1; text-align: center; color: var(--muted); font-size: 0.85rem; margin-top: -4px; font-variant-numeric: tabular-nums; }
.bw { color: var(--muted); font-size: 0.92rem; }

.status { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pill { border-radius: 8px; padding: 5px 10px; font-weight: 600; font-size: 0.92rem; }
.pill.unset, .pill.start { background: var(--chip); color: var(--muted); }
.pill.fresh { background: var(--accent-soft); color: var(--accent); }
.pill.up { background: var(--up-soft); color: var(--up); }
.pill.reps { background: var(--reps-soft); color: var(--reps); }
.pill.low { background: var(--low-soft); color: var(--low); }
.apply { border: 0; border-radius: 8px; padding: 6px 12px; background: var(--up); color: var(--surface); font-weight: 700; min-height: 36px; }

.log { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: end; }
.sets { display: flex; gap: 8px; flex-wrap: wrap; }
.sets label { display: grid; gap: 2px; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.sets input {
  width: 3.8rem; height: 46px; text-align: center; border: 1px solid var(--line); border-radius: 10px;
  background: var(--bg); font-size: 1.2rem; font-weight: 600; font-variant-numeric: tabular-nums;
}
.sets input::placeholder { color: var(--muted); opacity: 0.55; font-weight: 400; }
.save { height: 46px; border: 0; border-radius: 10px; padding: 0 18px; background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.msg { font-size: 0.88rem; color: var(--muted); min-height: 1.2em; margin-top: -6px; }
.msg.ok { color: var(--up); font-weight: 600; }
.msg.err { color: var(--low); font-weight: 600; }

.last { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 0.9rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.last b { color: var(--ink); font-weight: 600; }
.spark { width: 96px; height: 28px; flex: none; }
.spark .ln { fill: none; stroke: var(--accent); stroke-width: 1.8; }
.spark .ar { fill: var(--accent-soft); stroke: none; }
.spark .pt { fill: var(--accent); stroke: none; }

details.more { border-top: 1px solid var(--line); padding-top: 8px; }
details.more summary { cursor: pointer; color: var(--muted); font-size: 0.9rem; font-weight: 600; min-height: 32px; display: flex; align-items: center; }
.hist { display: grid; gap: 2px; margin: 6px 0 10px; font-size: 0.92rem; font-variant-numeric: tabular-nums; }
.hist div { display: grid; grid-template-columns: 4.4rem 4.8rem 1fr auto; gap: 8px; align-items: center; min-height: 40px; border-top: 1px solid var(--line); }
.hist div:first-child { border-top: 0; }
.hist .d { color: var(--muted); }
.hist .empty { margin: 0; color: var(--muted); }
.del { border: 1px solid var(--line); background: none; color: var(--low); border-radius: 8px; padding: 0 10px; height: 34px; font-size: 0.85rem; font-weight: 600; }
.del.armed { background: var(--low); color: var(--surface); border-color: var(--low); }
.showall { justify-self: start; border: 0; background: none; color: var(--accent); font-weight: 600; font-size: 0.9rem; padding: 8px 0; }
.cue { margin: 4px 0 8px; font-size: 0.95rem; max-width: 62ch; }
.links { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.links a { color: var(--accent); font-weight: 600; font-size: 0.92rem; }

.settings { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px; background: var(--surface); }
.settings summary { cursor: pointer; font-weight: 600; min-height: 36px; display: flex; align-items: center; }
.settings .body { display: grid; gap: 10px; padding: 8px 0 4px; font-size: 0.95rem; }
.settings .body p { margin: 0; color: var(--muted); }
.settings input[type="date"] { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--bg); font-size: 16px; justify-self: start; }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; }
.btn2 { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 0 14px; height: 44px; font-weight: 600; }

.timer {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  background: var(--ink); color: var(--bg);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
}
.timer .in { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; }
.timer .lbl { font-size: 0.82rem; opacity: 0.75; text-transform: uppercase; letter-spacing: 0.06em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.timer .clock { font-family: var(--font-display); font-weight: 700; font-size: 2.3rem; line-height: 1; font-variant-numeric: tabular-nums; }
.timer .btns { grid-row: 1 / span 2; grid-column: 2; display: flex; gap: 8px; }
.timer button { height: 44px; border-radius: 10px; border: 1px solid currentColor; background: none; color: inherit; padding: 0 12px; font-weight: 700; }
.timer .bar { grid-column: 1 / -1; height: 4px; background: rgba(127,127,127,0.35); border-radius: 2px; overflow: hidden; }
.timer .bar i { display: block; height: 100%; background: var(--accent); width: 100%; transition: width 0.25s linear; }
.timer.done { background: var(--up); color: var(--surface); }
@media (prefers-reduced-motion: reduce) { .timer .bar i { transition: none; } }
@media (max-width: 420px) {
  .log { grid-template-columns: 1fr; }
  .save { width: 100%; }
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><h1>Siłownia</h1><span class="today" id="today"></span></div>
    <div class="tabs-scroll"><nav class="tabs" id="tabs" aria-label="Partie ciała"></nav></div>
  </div>
</header>
<main class="wrap" id="main"></main>
<div class="timer" id="timer" hidden>
  <div class="in">
    <span class="lbl" id="t-lbl">Przerwa</span>
    <div class="btns"><button type="button" id="t-plus">+15 s</button><button type="button" id="t-stop">Koniec</button></div>
    <span class="clock" id="t-clock">0:00</span>
    <div class="bar"><i id="t-bar"></i></div>
  </div>
</div>
<input type="file" id="import-file" accept="application/json,.json" hidden>

<script>
(() => {
'use strict';

/* ---------- Plan według partii ciała (z „Plan - trening siłowy”, 29.10.2026) ---------- */
// load: bar (gryf 20 kg) · db (kg na hantel) · cable · machine · bw (masa ciała) · bwplus (dociążenie / wspomaganie)
// days: kiedy ćwiczenie jest w planie; wk: serie tygodniowo, gdy różne w różne dni
const PARTS = [
  { id: 'plecy', name: 'Plecy', subs: [
    { name: 'Szerokość', ex: [
      { id: 'P1', pl: 'Ściąganie drążka chwytem neutralnym', en: 'Lat Pulldown (Close Grip)', sets: 3, lo: 10, hi: 12, rest: 120, load: 'cable', inc: 2.5, days: ['pon'],
        cue: 'Chwyt neutralny (V-grip lub szeroki neutralny). Łokcie w dół do bioder, pauza 1 s ze ściągniętymi łopatkami, bez odchylania tułowia.' },
      { id: 'P2', pl: 'Podciąganie nachwytem', en: 'Pull Up', sets: 3, lo: 6, hi: 10, rest: 150, load: 'bwplus', inc: 2.5, days: ['czw'],
        cue: 'Nachwyt nieco szerzej niż barki. Poniżej 6 powtórzeń — guma lub maszyna wspomagana: wpisz ujemny ciężar (np. −20 = 20 kg wspomagania).' },
      { id: 'P3', pl: 'Ściąganie jednorącz na wyciągu w klęku', en: 'Single Arm Lat Pulldown', sets: 2, lo: 10, hi: 12, side: 'strona', rest: 75, load: 'cable', inc: 2.5, days: ['pt'],
        cue: 'W klęku, łokieć prowadź do biodra, pełne rozciągnięcie na górze.' },
    ] },
    { name: 'Grubość', ex: [
      { id: 'P4', pl: 'Wiosłowanie hantlami w podporze klatką', en: 'Chest Supported Incline Row (Dumbbell)', sets: 3, lo: 10, hi: 12, rest: 120, load: 'db', inc: 2, days: ['pon'],
        cue: 'Klatka oparta o ławkę skośną, łokcie wzdłuż tułowia, pauza 1 s na górze.' },
      { id: 'P5', pl: 'Wiosłowanie na wyciągu dolnym szerokim drążkiem', en: 'Seated Cable Row (Wide Grip)', sets: 3, lo: 10, hi: 12, rest: 120, load: 'cable', inc: 2.5, days: ['czw'],
        cue: 'Do dolnej części klatki, łokcie ~45°, pauza 1 s ze ściągniętymi łopatkami.' },
      { id: 'P6', pl: 'Wiosłowanie leżąc na maszynie — wąski uchwyt', en: 'Chest Supported T-Bar Row (Close Grip)', sets: 3, lo: 10, hi: 12, rest: 120, load: 'machine', inc: 2.5, days: [],
        cue: 'Leżąc twarzą w dół, klatka cały czas na oparciu. Uchwyt neutralny, łokcie blisko tułowia, ciągnij do brzucha — najszerszy i środek pleców. Pauza 1 s na górze. Wpisuj kg talerzy.' },
      { id: 'P7', pl: 'Wiosłowanie leżąc na maszynie — szeroki uchwyt', en: 'Chest Supported T-Bar Row (Wide Grip)', sets: 3, lo: 10, hi: 12, rest: 120, load: 'machine', inc: 2.5, days: [],
        cue: 'Leżąc twarzą w dół, nachwyt szeroko, łokcie na boki (~70°), ciągnij do dolnej części klatki — górna część pleców i tył barków. Pauza 1 s ze ściągniętymi łopatkami. Wpisuj kg talerzy.' },
    ] },
  ] },
  { id: 'barki', name: 'Barki', subs: [
    { name: 'Boczne', ex: [
      { id: 'B1', pl: 'Wznosy bokiem hantlami', en: 'Lateral Raise (Dumbbell)', sets: 3, lo: 12, hi: 15, rest: 70, load: 'db', inc: 1, days: ['pon', 'czw'],
        cue: 'Łokcie prowadzą ruch, barki z dala od uszu, bez bujania.' },
      { id: 'B2', pl: 'Wznosy bokiem jednorącz na wyciągu dolnym', en: 'Single Arm Lateral Raise (Cable)', sets: 3, lo: 12, hi: 15, rest: 70, load: 'cable', inc: 1.25, days: ['wt'],
        cue: 'Ruch od biodra w bok do wysokości barku. Powtórzenia na każdą rękę.' },
      { id: 'B3', pl: 'Wznosy bokiem na maszynie lub wyciągu', en: 'Lateral Raise (Machine)', sets: 3, lo: 12, hi: 15, rest: 70, load: 'machine', inc: 2.5, days: ['pt'],
        cue: 'Barki z dala od uszu, kontrolowane opuszczanie.' },
    ] },
    { name: 'Przód', ex: [
      { id: 'B4', pl: 'Wyciskanie hantli nad głowę siedząc', en: 'Seated Overhead Press (Dumbbell)', sets: 2, lo: 8, hi: 10, rest: 90, load: 'db', inc: 2, days: ['czw'],
        cue: 'Oparcie prawie pionowe, bez wyginania lędźwi.' },
      { id: 'B7', pl: 'Wyciskanie żołnierskie (sztanga nad głowę stojąc)', en: 'Overhead Press (Barbell)', sets: 3, lo: 8, hi: 10, rest: 150, load: 'bar', inc: 2.5, days: [],
        cue: 'Stojąc, stopy na szerokość bioder, pośladki i brzuch napięte. Sztanga z górnej części klatki, łokcie lekko przed gryfem. Głowa cofa się, by przepuścić sztangę, i wraca pod nią na górze. Bez odchylania lędźwi.' },
    ] },
    { name: 'Tył', ex: [
      { id: 'B5', pl: 'Face pull na wyciągu', en: 'Face Pull', sets: 3, lo: 12, hi: 15, rest: 70, load: 'cable', inc: 2.5, days: ['pon', 'pt'], wk: 5,
        cue: 'Lina na wysokości czoła, ciągnij do twarzy, na końcu rotacja na zewnątrz.' },
      { id: 'B6', pl: 'Odwrotne rozpiętki na maszynie', en: 'Rear Delt Reverse Fly (Machine)', sets: 3, lo: 12, hi: 15, rest: 70, load: 'machine', inc: 2.5, days: ['czw'],
        cue: 'Ramiona lekko zgięte, ruch z tyłu barków, nie ze ściągania łopatek.' },
    ] },
  ] },
  { id: 'klatka', name: 'Klatka i ramiona', subs: [
    { name: 'Klatka', ex: [
      { id: 'K1', pl: 'Wyciskanie hantli na ławce skośnej 30°', en: 'Incline Bench Press (Dumbbell)', sets: 3, lo: 8, hi: 10, rest: 120, load: 'db', inc: 2, days: ['pon', 'czw'],
        cue: 'Łopatki ściągnięte i opuszczone przez całą serię — pchanie z zaokrąglonymi barkami utrwala wadę postawy.' },
      { id: 'K4', pl: 'Wyciskanie sztangi na ławce płaskiej', en: 'Bench Press (Barbell)', sets: 3, lo: 8, hi: 10, rest: 150, load: 'bar', inc: 2.5, days: [],
        cue: 'Łopatki ściągnięte i opuszczone, stopy mocno w podłodze. Sztanga do dolnej części mostka, łokcie ~45–70° od tułowia, bez odbijania od klatki. Przy ciężkich seriach z asekuracją.' },
    ] },
    { name: 'Biceps', ex: [
      { id: 'K2', pl: 'Uginanie ramion z hantlami na ławce skośnej', en: 'Seated Incline Curl (Dumbbell)', sets: 2, lo: 10, hi: 12, rest: 60, load: 'db', inc: 1, days: ['czw'],
        cue: 'Łokcie za tułowiem — pełne rozciągnięcie bicepsa na dole.' },
    ] },
    { name: 'Triceps', ex: [
      { id: 'K3', pl: 'Prostowanie ramion na wyciągu (linka)', en: 'Triceps Rope Pushdown', sets: 2, lo: 10, hi: 12, rest: 60, load: 'cable', inc: 2.5, days: ['czw'],
        cue: 'Łokcie przy tułowiu, na dole rozchyl linę.' },
    ] },
  ] },
  { id: 'nogi', name: 'Nogi', subs: [
    { name: 'Przód uda', ex: [
      { id: 'N1', pl: 'Przysiad ze sztangą', en: 'Squat (Barbell)', sets: 3, lo: 8, hi: 10, rest: 150, load: 'bar', inc: 5, days: ['wt'],
        cue: 'Albo hack squat / Smith. Pełny zakres, opuszczanie 2–3 s, kolana w linii palców.' },

  if (loaded && last.kg !== L.kg) return { k: 'fresh', t: `Nowy ciężar — zacznij od ${ex.lo} ${unitWord(ex)}` };

  fr.onerror = () => { msg.textContent = 'Nie udało się odczytać pliku.'; };
  fr.readAsText(file);
}

document.addEventListener('click', ev => {
  const t = ev.target.closest('button');
  if (!t) return;
  if (t.dataset.go) { if (location.hash.replace('#', '') === t.dataset.go) render(); else location.hash = t.dataset.go; return; }
  if (t.dataset.jump) {
    const ex = EXM[t.dataset.jump];
    S.scrollTo = ex.id;
    if (location.hash.replace('#', '') === ex.part) render(); else location.hash = ex.part;
    return;
  }
  if (t.dataset.rest) { startRest(parseInt(t.dataset.rest, 10), EXM[t.closest('.ex').dataset.id].pl); return; }
  if (t.dataset.step) {
    const id = t.closest('.ex').dataset.id;
    const ex = EXM[id];
    const L = lift(id);
    let v = L.kg == null ? (ex.load === 'bar' ? 20 : (ex.load === 'bwplus' ? 0 : ex.inc)) : r2(L.kg + Number(t.dataset.step) * ex.inc);
    if (ex.load !== 'bwplus' && v < 0) v = 0;
    setKg(id, v);
    return;
  }
  if (t.dataset.apply) { setKg(t.dataset.apply, Number(t.dataset.v)); flash(t.dataset.apply, 'Nowy ciężar ustawiony — zacznij od dolnej granicy.', 'ok'); return; }
  if (t.dataset.save) { saveSession(t.dataset.save); return; }
  if (t.dataset.del) {
    const id = t.dataset.del, d = t.dataset.d;
    if (!t.dataset.armed) {
      t.dataset.armed = '1'; t.textContent = 'Na pewno?'; t.classList.add('armed');
      setTimeout(() => { if (t.isConnected && t.dataset.armed) { delete t.dataset.armed; t.textContent = 'Usuń'; t.classList.remove('armed'); } }, 4000);
      return;
    }
    const L = lift(id);
    L.history = (L.history || []).filter(e => e.d !== d);
    persist(); refreshCard(id); refreshReady();
    flash(id, `Usunięto wpis z ${dShort(d)}.`, 'ok');
    return;
  }
  if (t.dataset.all) { S.showAll[t.dataset.all] = !S.showAll[t.dataset.all]; refreshCard(t.dataset.all); return; }
  if (t.dataset.act === 'export') { exportData(); return; }
  if (t.dataset.act === 'import') { $('#import-file').click(); }
});
$('#import-file').addEventListener('change', ev => { const f = ev.target.files && ev.target.files[0]; if (f) importData(f); ev.target.value = ''; });
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.dataset.kg) {
    const raw = t.value.trim();
    const v = parseNum(raw);
    if (v == null && raw !== '' && raw !== '-' && raw !== '−') return;
    const id = t.dataset.kg;
    lift(id).kg = v;
    persist();
    const card = t.closest('.ex');
    $('[data-f="note"]', card).textContent = loadNote(EXM[id], v);
    const st = statusOf(EXM[id]);
    $('[data-f="status"]', card).innerHTML = `<span class="pill ${st.k}">${esc(st.t)}</span>`;
  } else if (t.dataset.rep) {
    (S.drafts[t.dataset.rep] = S.drafts[t.dataset.rep] || [])[Number(t.dataset.i)] = t.value;
  } else if (t.id === 'cycle') {
    if (t.value) S.settings.cycleStart = t.value; else delete S.settings.cycleStart;
    persist();
    $('#cyc-txt').textContent = cycleText();
    renderHeader();
  }
});
document.addEventListener('focusout', ev => {
  const t = ev.target;
  if (t.dataset && t.dataset.kg) { const id = t.dataset.kg; setTimeout(() => { refreshCard(id); refreshReady(); }, 0); }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && ev.target.dataset && ev.target.dataset.rep) { ev.preventDefault(); ev.target.blur(); saveSession(ev.target.dataset.rep); }
});
window.addEventListener('hashchange', render);

/* ---------- Przerwa ---------- */
const T = { end: 0, dur: 0, iv: null, ac: null, lock: null, hide: null, label: '' };
function audio() { try { T.ac = T.ac || new (window.AudioContext || window.webkitAudioContext)(); if (T.ac.state === 'suspended') T.ac.resume(); } catch (e) { T.ac = null; } }
function beep() {
  if (!T.ac) return;
  try {
    const now = T.ac.currentTime;
    [0, 0.25, 0.5].forEach(o => {
      const os = T.ac.createOscillator(), g = T.ac.createGain();
      os.frequency.value = 880; os.connect(g); g.connect(T.ac.destination);
      g.gain.setValueAtTime(0.0001, now + o); g.gain.exponentialRampToValueAtTime(0.3, now + o + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, now + o + 0.18);
      os.start(now + o); os.stop(now + o + 0.2);
    });
  } catch (e) { /* bez dźwięku */ }
}
async function lockOn() { try { if (navigator.wakeLock && !T.lock) T.lock = await navigator.wakeLock.request('screen'); } catch (e) { T.lock = null; } }
function lockOff() { try { if (T.lock) T.lock.release(); } catch (e) { /* nic */ } T.lock = null; }
function startRest(sec, label) {
  audio(); clearTimeout(T.hide);
  T.dur = sec; T.end = Date.now() + sec * 1000; T.label = label;
  const box = $('#timer'); box.hidden = false; box.classList.remove('done');
  $('#t-lbl').textContent = 'Przerwa · ' + label;
  clearInterval(T.iv); T.iv = setInterval(tick, 250); tick();
  lockOn();
}
function tick() {
  const leftMs = Math.max(0, T.end - Date.now());
  const s = Math.ceil(leftMs / 1000);
  $('#t-clock').textContent = `${Math.floor(s / 60)}:${pad(s % 60)}`;
  $('#t-bar').style.width = (T.dur ? (leftMs / (T.dur * 1000)) * 100 : 0) + '%';
  if (leftMs <= 0) {
    clearInterval(T.iv); T.iv = null;
    $('#timer').classList.add('done');
    $('#t-lbl').textContent = 'Koniec przerwy — następna seria';
    beep(); lockOff();
    T.hide = setTimeout(stopRest, 8000);
  }
}
function stopRest() { clearInterval(T.iv); T.iv = null; clearTimeout(T.hide); $('#timer').hidden = true; lockOff(); }
$('#t-plus').addEventListener('click', () => { if (!T.iv) { startRest(15, T.label || 'dodatkowe 15 s'); return; } T.end += 15000; T.dur += 15; });
$('#t-stop').addEventListener('click', stopRest);
document.addEventListener('visibilitychange', () => { if (!document.hidden && T.iv) { tick(); lockOn(); } });

/* ---------- Start ---------- */
render();
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
})();
</script>
